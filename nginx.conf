server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Drone images can be sizeable; raise the default 1M upload limit.
    client_max_body_size 25M;

    # The Django app exposes its API routes at the root (no /api/ prefix),
    # so list them explicitly and proxy just those paths to the backend.
    location ~ ^/(signup|login|upload-image|download-report|download-gis-report)/?$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded images and YOLO output overlays served by Django's MEDIA_URL
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Django's own static files (mainly /admin CSS/JS). Django itself doesn't
    # serve these with DEBUG=False, so `collectstatic` writes them to a
    # volume shared with the backend container and nginx serves them
    # directly. See the `django_static` volume in docker-compose.yml.
    location /static/ {
        alias /usr/share/nginx/django-static/;
    }

    # React SPA — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
