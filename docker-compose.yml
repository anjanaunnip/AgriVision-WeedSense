services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    volumes:
      - media_data:/app/agrivision/media
      - django_static:/app/agrivision/staticfiles
      # Model weights aren't committed to the repo (.gitignore excludes
      # *.pt). Put your trained best.pt next to this file and it'll be
      # mounted in read-only. See YOLO_MODEL_PATH in .env.example.
      - ./best.pt:/app/best.pt:ro
    expose:
      - "8000"
    restart: unless-stopped
    # Uncomment once you enable the optional Postgres service below
    # depends_on:
    #   - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    volumes:
      - django_static:/usr/share/nginx/django-static:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: switch from SQLite to Postgres for real multi-user traffic.
  # Uncomment this service and the matching POSTGRES_* vars in .env.
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB}
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  media_data:
  django_static:
  # pg_data:
